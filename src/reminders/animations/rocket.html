<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
	<style>
		:root {
			color-scheme: light dark;
			font-family: var(--vscode-font-family);
			color: var(--vscode-foreground);
			background: var(--vscode-editor-background);
		}
		body { margin: 0; min-height: 100vh; overflow: hidden; background: var(--vscode-editor-background); }
		.flight {
			position: absolute;
			top: 50%;
			left: 0;
			display: flex;
			align-items: center;
			width: max-content;
			max-width: calc(100vw - 32px);
			animation: fly {{duration}}ms cubic-bezier(.2, .65, .35, 1) both;
		}
		.banner {
			position: relative;
			z-index: 1;
			display: flex;
			align-items: center;
			gap: 14px;
			width: min(540px, calc(100vw - 116px));
			min-height: 76px;
			box-sizing: border-box;
			padding: 16px 22px;
			background: #f5c542;
			color: #242424;
			border: 2px solid #8e6821;
			box-shadow: 0 8px 22px #0005;
			clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%);
		}
		.banner.classic { background: repeating-linear-gradient(3deg, #f8d66d 0 12px, #f5c542 12px 24px); border-radius: 8px; }
		.banner.comic { background: #fff5dc; border: 4px solid #202020; box-shadow: 7px 7px 0 #e55436, 0 8px 22px #0005; transform: rotate(-2deg); }
		.banner.neon { background: #17132b; color: #f8efff; border: 2px solid #f16bff; box-shadow: 0 0 12px #f16bff, 0 0 28px #9a5cff, 0 8px 22px #0008; }
		.message { flex: 1; font-size: clamp(16px, 2.4vw, 24px); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; }
		.icon { flex: 0 0 auto; font-size: 34px; line-height: 1; }
		.plane { position: relative; z-index: 2; flex: 0 0 auto; width: 96px; height: 72px; margin-left: -4px; filter: drop-shadow(0 5px 4px #0005); animation: bob 900ms ease-in-out infinite alternate; }
		.status { position: fixed; bottom: 16px; left: 16px; color: var(--vscode-descriptionForeground); font-size: 12px; }
		.replay { margin-left: 8px; padding: 4px 8px; border: 1px solid var(--vscode-button-border, transparent); border-radius: 4px; color: var(--vscode-button-foreground); background: var(--vscode-button-background); font: inherit; cursor: pointer; }
		.replay:hover { background: var(--vscode-button-hoverBackground); }
		@keyframes fly { from { transform: translate(-100%, -50%); } to { transform: translate(100vw, -50%); } }
		@keyframes bob { from { transform: translateY(-4px) rotate(-2deg); } to { transform: translateY(4px) rotate(2deg); } }
		@media (prefers-reduced-motion: reduce) { .flight, .plane { animation-duration: 1ms; } }
	</style>
</head>
<body>
	<main class="flight" role="status" aria-live="polite">
		<section class="banner {{messageStyle}}" aria-label="Reminder banner">
			<div class="icon" aria-hidden="true">✈️</div>
			<div class="message">{{message}}</div>
		</section>
		<svg class="plane" viewBox="0 0 160 110" role="img" aria-label="Airplane towing the reminder banner">
			<path d="M7 55h45" fill="none" stroke="var(--vscode-descriptionForeground)" stroke-width="2" stroke-dasharray="5 5"/>
			<path d="M151 49 20 18c-8-2-12 2-8 8l31 27-30 18c-5 3-2 9 5 8l46-8 39 28c6 4 12 1 10-6l-10-27 48-5c8-1 8-9 0-12Z" fill="#e84646" stroke="#a91f32" stroke-width="3" stroke-linejoin="round"/>
			<path d="m50 53 28-5-8 18-22 4Z" fill="#ffcf57" stroke="#a91f32" stroke-width="2"/>
			<circle cx="127" cy="55" r="3" fill="#fff"/>
		</svg>
	</main>
	<div class="status" id="status" aria-live="polite">
		<span id="audio-status"></span>
		<button class="replay" id="replay" type="button">Play sound</button>
	</div>
	<script nonce="{{nonce}}">
		const sound = {{sound}};
		const status = document.getElementById('audio-status');
		const replay = document.getElementById('replay');
		const playSound = async () => {
			if (sound === 'silent') {
				status.textContent = 'This reminder is set to no sound.';
				replay.hidden = true;
				return;
			}
			try {
				const audio = new AudioContext();
				await audio.resume();
				if (audio.state !== 'running') throw new Error('Audio playback is not enabled.');
				const now = audio.currentTime;
				const tone = (frequency, offset, duration, wave = 'sine', endFrequency = frequency) => {
					const oscillator = audio.createOscillator();
					const volume = audio.createGain();
					oscillator.type = wave;
					oscillator.frequency.setValueAtTime(frequency, now + offset);
					oscillator.frequency.exponentialRampToValueAtTime(endFrequency, now + offset + duration);
					volume.gain.setValueAtTime(0.0001, now + offset);
					volume.gain.exponentialRampToValueAtTime(0.12, now + offset + 0.02);
					volume.gain.exponentialRampToValueAtTime(0.0001, now + offset + duration);
					oscillator.connect(volume);
					volume.connect(audio.destination);
					oscillator.start(now + offset);
					oscillator.stop(now + offset + duration);
				};
				if (sound === 'chirp') {
					tone(880, 0, 0.18, 'sine', 1180);
					tone(1180, 0.2, 0.24, 'sine', 940);
				} else if (sound === 'boing') {
					tone(300, 0, 0.42, 'triangle', 900);
				} else {
					[523, 659, 784, 1047].forEach((frequency, index) => tone(frequency, index * 0.13, 0.2, 'triangle'));
				}
				status.textContent = '';
				replay.textContent = 'Play again';
				setTimeout(() => audio.close(), 1200);
			} catch {
				status.textContent = 'Sound was blocked. Click to play.';
				replay.textContent = 'Play sound';
			}
		};
		replay.addEventListener('click', () => void playSound());
		void playSound();
	</script>
</body>
</html>
